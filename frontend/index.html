<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />

         rewrites React's text nodes and can crash the interface, so it is off. -->
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NeX Camp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400..900;1,400..900&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap"
    />
    <!-- EXTENSION HOOK (see HOOKS.md): installable app shell (PWA). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#151515" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/logo-mark.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
  </head>
  <body style="background:#151515">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
